<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IndoGovRAG Favicon">
  <title>IndoGovRAG Favicon</title>
  <desc>Simplified square favicon for IndoGovRAG</desc>

  <defs>
    <linearGradient id="fgShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="fgAmberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <clipPath id="fgShieldClip">
      <rect x="16" y="6" width="32" height="48" rx="3" ry="3"/>
      <polygon points="16,54 48,54 32,64"/>
    </clipPath>
  </defs>

  <!-- ─── BACKGROUND CIRCLE ─── -->
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="#312e81" opacity="0.08"/>
  <circle cx="32" cy="32" r="24" fill="#ffffff"/>

  <!-- ─── SHIELD MARK ─── -->
  <!-- Shield top bar -->
  <rect x="20" y="12" width="24" height="5" rx="1.5" ry="1.5"
        fill="url(#fgShieldGrad)"/>
  <!-- Shield body -->
  <rect x="20" y="17" width="24" height="30" rx="2" ry="2"
        fill="url(#fgShieldGrad)"/>
  <!-- Shield bottom point -->
  <polygon points="20,47 44,47 32,57"
           fill="#312e81"/>
  <!-- Shield border -->
  <rect x="20" y="17" width="24" height="30" rx="2" ry="2"
        fill="none" stroke="#6366f1" stroke-width="0.8" opacity="0.5"/>
  <!-- Shield left highlight -->
  <rect x="20" y="17" width="2" height="30" rx="1"
        fill="#818cf8" opacity="0.4"/>

  <!-- ─── GARUDA EAGLE (simplified) ─── -->
  <!-- Body -->
  <ellipse cx="32" cy="27" rx="2.5" ry="3.5" fill="#a5b4fc"/>
  <!-- Head -->
  <circle cx="34" cy="24.5" r="1.8" fill="#a5b4fc"/>
  <!-- Left wing -->
  <path d="M30,25 Q27,22.5 26,26 Q27.5,27.5 30,27" fill="#a5b4fc" opacity="0.9"/>
  <!-- Right wing -->
  <path d="M34,25 Q37,22.5 38,26 Q37,27.5 34,27" fill="#a5b4fc" opacity="0.9"/>
  <!-- Tail -->
  <path d="M30.5,30.5 Q32,34 32,37 Q32,34 33.5,30.5" fill="#a5b4fc" opacity="0.8"/>

  <!-- ─── DATA LINES (RAG element) ─── -->
  <line x1="20" y1="40" x2="29" y2="40" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="43" x2="27" y2="43" stroke="#fbbf24" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="20" y1="46" x2="28" y2="46" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ─── AMBER STAR TOP ─── -->
  <circle cx="32" cy="12" r="1.8" fill="url(#fgAmberGrad)"/>
  <circle cx="32" cy="12" r="0.8" fill="#fffbe6"/>

  <!-- ─── BOTTOM TEXT BAR ─── -->
  <rect x="10" y="57" width="44" height="6" rx="1" ry="1" fill="#312e81" opacity="0.85"/>
  <text x="32" y="62"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="5.5"
        font-weight="700"
        text-anchor="middle"
        letter-spacing="0.8"
        fill="#ffffff">INDOGOVRAG</text>

</svg>