# =============================================================================
# IndoGovRAG - Docker Compose for Production
# =============================================================================
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose up --build     # Rebuild and start
#   docker-compose down -v        # Stop and remove volumes
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # FastAPI Backend Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: indogovrag-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Database / ChromaDB
      - CHROMA_DB_DIR=/app/data/vector_db/chroma
      - DATA_DIR=/app/data
    env_file:
      - .env
    volumes:
      # Persist vector database
      - indogovrag-vector-db:/app/data/vector_db
      # Persist evaluation results
      - indogovrag-evaluations:/app/data/evaluations
      # Persist logs
      - indogovrag-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - indogovrag-network

  # ---------------------------------------------------------------------------
  # Frontend Service (Next.js via Node server)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: indogovrag-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - indogovrag-network

